name: Owned journal framing
on:
  push:
    paths:
      - 'research/owned-authority/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/owned-framing.yml'
  pull_request:
    paths:
      - 'research/owned-authority/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/owned-framing.yml'
permissions:
  contents: read
jobs:
  framing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/owned-authority/framing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 check.py target/debug/continuum-journal-framing
      - run: python3 check_journal.py target/debug/continuum-journal-framing
      - run: python3 check_store.py target/debug/owned-store
      - run: python3 check_archive.py target/debug/owned-store
      - name: Check finite semantic oracle against the SQLite reference
        run: |
          cargo build --manifest-path ../../../Cargo.toml --locked
          python3 ../oracle/check.py --binary ../../../target/debug/continuum
