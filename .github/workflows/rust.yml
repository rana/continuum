name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo run --locked -- demo "$RUNNER_TEMP/continuum-demo.db"
      - name: Check workload outcomes without a timing threshold
        run: cargo run --locked --example measure_workloads -- --samples 3 --directory "$RUNNER_TEMP"
      - name: Check disposable project checkpoint adapter
        run: |
          cargo build --locked
          python3 -m unittest discover -s tools -p 'test_project_checkpoint.py'
      - name: Check independent CSV continuation result
        run: |
          python3 -m unittest discover -s examples/csv_inspector -p 'test_*.py' -v
          python3 research/runs/independent-csv-pilot/verify_requirement.py examples/csv_inspector/inspect_csv.py > "$RUNNER_TEMP/csv-oracle.json"
      - name: Reconstruct a real recorded attempt in fresh stores
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          binary = pathlib.Path('target/debug/continuum')
          provenance = {
              'source_commit': os.environ['GITHUB_SHA'],
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'build_command': 'cargo build --locked',
              'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
              'scope': 'Current hosted CI build, not the historical pilot binary.'
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'checkpoint-build.json').write_text(json.dumps(provenance))
          PY
          python3 research/runs/checkpoint-object-import/reproduce.py --binary target/debug/continuum --build-provenance "$RUNNER_TEMP/checkpoint-build.json" --output "$RUNNER_TEMP/recorded-attempt-reconstruction"
      - name: Verify fresh-receiver evidence without new inference
        run: python3 research/runs/recorded-attempt-receiver/verify_records.py
      - name: Capture source-bound verification and failed worker evidence
        run: |
          python3 research/runs/source-bound-verification/verify_records.py
          python3 research/runs/source-bound-verification/capture.py --binary target/debug/continuum --build-provenance "$RUNNER_TEMP/checkpoint-build.json" --output "$RUNNER_TEMP/source-bound-verification"
          python3 research/runs/source-bound-verification/check_failure_capture.py --binary target/debug/continuum --build-provenance "$RUNNER_TEMP/checkpoint-build.json" --output "$RUNNER_TEMP/source-bound-failure"
