[package]
name = "continuum-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An experimental native object and transition core for agentic repositories"

[features]
default = []
# Enables deliberate process exits for the subprocess recovery tests only.
fault-injection = []

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "continuum"
path = "src/main.rs"

